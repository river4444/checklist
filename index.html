<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daily Focus Journal</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --box-border: #222;
            --bar-track: #1a1a1a;
            --bar-fill: #ffffff;
            --color-meditate: #4a90e2;
            --color-yoga: #a370f7;
            --color-workout: #f1c40f;
            --color-walk: #2ecc71;
            --color-nw: #555555;
            --color-w: #ff4b2b;
        }

        /* Password Lock Styles */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .lock-input {
            background: #111; border: 1px solid #333; color: white;
            padding: 15px; border-radius: 8px; text-align: center;
            font-size: 1.5rem; outline: none; width: 150px;
            font-family: inherit; letter-spacing: 5px;
        }
        .lock-input:focus { border-color: #666; }
        .hidden-app { display: none !important; }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background-color: var(--bg-color); 
            color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; cursor: default;
        }

        .main-content {
            width: 100%; max-width: 480px; padding: 60px 24px;
            display: flex; flex-direction: column; gap: 30px;
        }

        /* Year Progress */
        .progress-section { text-align: center; }
        .percentage-display { font-size: 4rem; font-weight: 200; margin: 0; line-height: 1; letter-spacing: -2px; }
        .progress-container { width: 100%; height: 2px; background: var(--bar-track); border-radius: 1px; margin: 1.5rem 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--bar-fill); transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Date Navigator */
        .date-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .date-display { font-size: 1.1rem; font-weight: 300; text-transform: uppercase; letter-spacing: 0.1em; color: #fff; }
        .nav-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; padding: 6px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; 
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); }
        .nav-btn:active { transform: scale(0.95); }

        /* Inputs */
        .wake-section { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
        .wake-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.1em; }
        .wake-input { 
            background: transparent; border: none; color: #fff; font-size: 1.5rem; font-weight: 300; 
            text-align: right; width: 140px; outline: none; font-family: inherit; 
        }

        .habits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 10px 0; }
        
        .habit-item { display: flex; align-items: center; font-size: 1rem; cursor: pointer; color: #ccc; }
        .habit-item input { display: none; }
        .custom-checkbox { 
            width: 24px; height: 24px; border: 1px solid rgba(255, 255, 255, 0.25); 
            border-radius: 6px; margin-right: 12px; position: relative; 
            background: rgba(0, 0, 0, 0.3); flex-shrink: 0; transition: 0.2s;
        }
        .habit-item input:checked + .custom-checkbox::after { 
            content: ''; position: absolute; left: 8px; top: 4px; width: 5px; height: 10px; 
            border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); 
        }

        /* Habit Specific Colors */
        .habit-item input[data-habit="0"]:checked + .custom-checkbox { background: var(--color-meditate); border-color: var(--color-meditate); }
        .habit-item input[data-habit="1"]:checked + .custom-checkbox { background: var(--color-yoga); border-color: var(--color-yoga); }
        .habit-item input[data-habit="2"]:checked + .custom-checkbox { background: var(--color-workout); border-color: var(--color-workout); }
        .habit-item input[data-habit="3"]:checked + .custom-checkbox { background: var(--color-walk); border-color: var(--color-walk); }

        textarea { 
            width: 100%; height: 200px; background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; 
            color: #eee; padding: 20px; resize: none; font-family: inherit; 
            margin-top: 15px; line-height: 1.6; font-size: 1rem; outline: none; 
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: rgba(255,255,255,0.3); }

        /* NW / W Sub-habits */
        .w-choice-container { display: flex; gap: 20px; margin-top: 15px; opacity: 0.3; transition: 0.3s; justify-content: flex-end; }
        .w-choice-container:hover { opacity: 1; }
        .w-choice-container .habit-item { font-size: 0.8rem; }
        .w-choice-container .custom-checkbox { width: 20px; height: 20px; border-radius: 4px; }
        .w-choice-container .habit-item input[data-habit="4"]:checked + .custom-checkbox { background: var(--color-nw); border-color: var(--color-nw); }
        .w-choice-container .habit-item input[data-habit="5"]:checked + .custom-checkbox { background: var(--color-w); border-color: var(--color-w); }
        .w-choice-container .habit-item input:checked + .custom-checkbox::after { left: 6px; top: 2px; }

        /* Footer / Actions */
        .actions-row { display: flex; gap: 10px; margin-top: 40px; }
        .action-btn { 
            flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.1); 
            color: var(--text-secondary); padding: 12px; font-size: 0.7rem; 
            border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em;
            transition: 0.2s;
        }
        .action-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .agreements {
            display: flex; flex-direction: column; gap: 6px; margin-top: 40px;
            text-align: center; border-top: 1px solid #1a1a1a; padding-top: 30px;
        }
        .agreement-item { font-size: 0.55rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.5; }
    </style>
</head>
<body>

<!-- Password Overlay -->
<div id="lock-screen">
    <input type="password" id="pass-input" class="lock-input" placeholder="•" autofocus oninput="checkPass(this.value)">
</div>

<div id="app-container" class="hidden-app main-content">
    
    <div class="progress-section">
        <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>
        <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="date-nav">
        <button class="nav-btn" onclick="changeDay(-1)">←</button>
        <div id="date-display" class="date-display">Date</div>
        <button class="nav-btn" onclick="changeDay(1)">→</button>
    </div>

    <div class="wake-section">
        <span class="wake-label">Wake Up</span>
        <input type="text" id="wake-time" class="wake-input" placeholder="--:-- AM">
    </div>

    <div class="habits-grid">
        <label class="habit-item"><input type="checkbox" class="habit-cb" data-habit="0"><span class="custom-checkbox"></span>Meditate</label>
        <label class="habit-item"><input type="checkbox" class="habit-cb" data-habit="1"><span class="custom-checkbox"></span>Yoga</label>
        <label class="habit-item"><input type="checkbox" class="habit-cb" data-habit="2"><span class="custom-checkbox"></span>Workout</label>
        <label class="habit-item"><input type="checkbox" class="habit-cb" data-habit="3"><span class="custom-checkbox"></span>Walk</label>
    </div>

    <textarea id="journal-text" placeholder="Journal your day here..."></textarea>
    
    <div class="w-choice-container">
        <label class="habit-item"><input type="checkbox" class="habit-cb" data-habit="4" id="cb-nw"><span class="custom-checkbox"></span>NW</label>
        <label class="habit-item"><input type="checkbox" class="habit-cb" data-habit="5" id="cb-w"><span class="custom-checkbox"></span>W</label>
    </div>

    <div class="actions-row">
        <button class="action-btn" onclick="saveDataFile()">Export Data</button>
        <button class="action-btn" onclick="document.getElementById('load-input').click()">Import Data</button>
        <input type="file" id="load-input" style="display:none" onchange="loadDataFile(event)">
    </div>

    <div class="agreements">
        <div class="agreement-item">I. Be impeccable with your word</div>
        <div class="agreement-item">II. Do not take anything personally</div>
        <div class="agreement-item">III. Do not make assumptions</div>
        <div class="agreement-item">IV. Always do your best</div>
    </div>

</div>

<script>
    // --- PASSWORD LOGIC ---
    function checkPass(val) {
        if (val === "2") {
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app-container').classList.remove('hidden-app');
            }, 500);
        }
    }

    // --- APP LOGIC ---
    let viewedDate = getPerthTime();

    // Gets current time locked to Perth timezone
    function getPerthTime() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-US', { timeZone: 'Australia/Perth', year: 'numeric', month: 'numeric', day: 'numeric' });
        const parts = formatter.formatToParts(now);
        const d = {}; parts.forEach(p => d[p.type] = p.value);
        return new Date(d.year, d.month - 1, d.day);
    }

    // Gets standard "YYYY-M-D" key used for storage
    function getDateKey(dateObj) {
        return `${dateObj.getFullYear()}-${dateObj.getMonth()}-${dateObj.getDate()}`;
    }

    // Changes viewed day by offset
    function changeDay(offset) {
        viewedDate.setDate(viewedDate.getDate() + offset);
        loadDayData();
    }

    // Loads the data for the currently viewed date
    function loadDayData() {
        // Update Title Date
        const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        document.getElementById('date-display').innerText = viewedDate.toLocaleDateString('en-US', options);

        // Update Progress Bar based on viewed date
        const start = new Date(viewedDate.getFullYear(), 0, 1);
        const end = new Date(viewedDate.getFullYear() + 1, 0, 1);
        const percent = (((viewedDate - start) / (end - start)) * 100).toFixed(1);
        document.getElementById('percentage').innerText = percent;
        setTimeout(() => { document.getElementById('progress-fill').style.width = percent + '%'; }, 100);

        // Fetch Data from LocalStorage
        const key = getDateKey(viewedDate);
        const data = JSON.parse(localStorage.getItem(key)) || { text: "", habits: [false,false,false,false,false,false], wake: "" };
        
        // Populate Inputs
        document.getElementById('wake-time').value = data.wake || "";
        document.getElementById('journal-text').value = data.text || "";
        
        const checkboxes = document.querySelectorAll('.habit-cb');
        checkboxes.forEach((cb) => {
            const index = parseInt(cb.getAttribute('data-habit'));
            cb.checked = data.habits ? !!data.habits[index] : false;
        });
    }

    // Saves the currently viewed data to LocalStorage
    function saveDayData() {
        const key = getDateKey(viewedDate);
        
        const text = document.getElementById('journal-text').value;
        const wake = document.getElementById('wake-time').value;
        
        const checkboxes = document.querySelectorAll('.habit-cb');
        const habits = Array.from(checkboxes).map(cb => cb.checked);

        localStorage.setItem(key, JSON.stringify({ text, habits, wake }));
    }

    // Formats the wake time cleanly on blur
    function formatWakeTime(v) {
        let c = v.replace(/[^0-9]/g, ''); if (!c) return "";
        let h, m; 
        if (c.length <= 2) { h = parseInt(c); m = 0; } 
        else if (c.length === 3) { h = parseInt(c[0]); m = parseInt(c.slice(1)); } 
        else { h = parseInt(c.slice(0, 2)); m = parseInt(c.slice(2, 4)); }
        
        if (h > 12) h = 12; if (m > 59) m = 59; if (h === 0) h = 12;
        return `${h}:${m.toString().padStart(2, '0')} AM`;
    }

    // Backup & Restore
    function saveDataFile() {
        const data = {}; 
        for (let i = 0; i < localStorage.length; i++) { data[localStorage.key(i)] = localStorage.getItem(localStorage.key(i)); }
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); 
        a.download = `tracker_backup.json`; 
        a.click();
    }

    function loadDataFile(e) {
        const reader = new FileReader(); 
        reader.onload = (ev) => { 
            const d = JSON.parse(ev.target.result); 
            Object.keys(d).forEach(k => localStorage.setItem(k, d[k])); 
            loadDayData(); 
        }; 
        reader.readAsText(e.target.files[0]);
    }

    // Setup Listeners
    function setupListeners() {
        const wake = document.getElementById('wake-time');
        const text = document.getElementById('journal-text');
        const habits = document.querySelectorAll('.habit-cb');
        const nw = document.getElementById('cb-nw');
        const w = document.getElementById('cb-w');

        // Mutually exclusive toggle for NW and W
        nw.onchange = () => { if (nw.checked) w.checked = false; saveDayData(); };
        w.onchange = () => { if (w.checked) nw.checked = false; saveDayData(); };

        // Save on changes
        wake.onblur = () => { wake.value = formatWakeTime(wake.value); saveDayData(); };
        text.oninput = saveDayData;
        habits.forEach(h => { 
            if (h.id !== 'cb-nw' && h.id !== 'cb-w') {
                h.onchange = saveDayData; 
            }
        });
    }

    // Initialize App
    window.onload = () => {
        setupListeners();
        loadDayData();
    };
</script>
</body>
</html>
